/* photo card */
.card{position:absolute;left:50%;top:372px;transform:translateX(-50%);width:452px;height:556px;
  border-radius:24px;border:9px solid #FDFFA7;overflow:hidden;

.ren{top:214px;right:104px;font-size:184px;color:#fff;-webkit-text-stroke:12px #141414;transform:rotate(4deg);
