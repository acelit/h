<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 AI Agent 最全导航</title>
<style>
  :root{
    --paper: oklch(96.5% 0.018 95);
    --paper-raised: oklch(93.5% 0.022 95);
    --paper-inset: oklch(98% 0.012 95);
    --ink: oklch(27% 0.02 70);
    --ink-soft: oklch(46% 0.02 70);
    --ink-faint: oklch(60% 0.016 75);
    --rule: oklch(84% 0.02 88);
    --rule-strong: oklch(72% 0.025 85);
    --accent: oklch(46% 0.1 148);
    --accent-deep: oklch(38% 0.09 150);
    --accent-wash: oklch(92% 0.04 142);
    --ext: oklch(52% 0.13 46);
    --ext-wash: oklch(93% 0.045 55);
    --shell: 1220px;
    --2xs:4px; --xs:8px; --sm:12px; --md:20px; --lg:32px; --xl:52px; --2xl:80px;
    --font-display:"Fraunces","Songti SC","STSong","Noto Serif SC",Georgia,serif;
    --font-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.62;
    font-feature-settings:"tnum" 1;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none;}

  /* ===== masthead ===== */
  .masthead{border-bottom:1.5px solid var(--rule-strong);}
  .masthead-in{max-width:var(--shell);margin:0 auto;padding:var(--lg) var(--lg) var(--md);}
  .kicker{
    font-family:var(--font-mono);font-size:11px;text-transform:uppercase;
    letter-spacing:.28em;color:var(--accent);margin:0 0 var(--sm);
  }
  h1.title{
    font-family:var(--font-display);font-weight:900;
    font-size:clamp(28px,5.2vw,46px);line-height:1.04;letter-spacing:-.01em;
    margin:0 0 var(--sm);overflow-wrap:anywhere;
  }
  .lede{font-size:15px;max-width:66ch;color:var(--ink-soft);margin:0 0 var(--md);}
  .lede a{color:var(--accent-deep);border-bottom:1px solid var(--accent-wash);transition:border-color .18s;}
  .lede a:hover{border-color:var(--accent-deep);}
  .toolbar{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--md);}
  .search{
    flex:1;min-width:min(100%,320px);border:none;border-bottom:1.5px solid var(--rule-strong);
    background:transparent;font-size:17px;font-family:var(--font-body);color:var(--ink);
    padding:6px 2px;transition:border-color .18s cubic-bezier(.22,.61,.36,1),box-shadow .18s;
  }
  .search::placeholder{color:var(--ink-faint);}
  .search:focus{outline:none;border-color:var(--accent);box-shadow:0 1.5px 0 0 var(--accent);}
  .readout{font-family:var(--font-mono);font-size:12.5px;color:var(--ink-soft);white-space:nowrap;}
  .readout b{color:var(--accent-deep);}
  .langtoggle{
    display:inline-flex;border:1px solid var(--rule-strong);border-radius:999px;overflow:hidden;
    font-family:var(--font-mono);font-size:12px;
  }
  .langtoggle button{
    border:none;background:transparent;cursor:pointer;padding:6px 14px;color:var(--ink-faint);
    font-family:var(--font-mono);font-size:12px;letter-spacing:.04em;transition:all .16s;
  }
  .langtoggle button.on{background:var(--accent-wash);color:var(--accent-deep);font-weight:600;}
  .langtoggle button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}

  /* ===== shell ===== */
  .shell{display:grid;grid-template-columns:236px 1fr;max-width:var(--shell);margin:0 auto;}
  .shell>*{min-width:0;}
  .rail{position:sticky;top:0;align-self:start;border-right:1px solid var(--rule);padding:var(--lg) var(--md) var(--2xl);max-height:100vh;overflow-y:auto;}
  .rail-title{
    font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.24em;
    color:var(--ink-faint);padding-bottom:var(--sm);border-bottom:1px solid var(--rule);margin:0 0 var(--xs);
  }
  .rail ul{list-style:none;margin:0;padding:0;}
  .rail li{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:7px 10px 7px 12px;border-radius:2px;color:var(--ink-soft);cursor:pointer;position:relative;
    transition:color .16s,background .16s;
  }
  .rail li::before{
    content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--accent);
    transform:scaleY(0);transform-origin:top;transition:transform .18s;
  }
  .rail li:hover{color:var(--ink);background:var(--paper-inset);}
  .rail li.active{color:var(--accent-deep);background:var(--accent-wash);}
  .rail li.active::before{transform:scaleY(1);}
  .rail li:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .rail .cname{font-size:14px;}
  .rail .ccount{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .rail li.active .ccount{color:var(--accent-deep);}

  /* ===== catalogue ===== */
  .catalogue{padding:var(--lg) var(--md) var(--2xl) var(--xl);}
  .cat-block{margin-bottom:var(--xl);}
  .cat-head{display:flex;align-items:baseline;gap:var(--sm);border-bottom:1.5px solid var(--rule-strong);padding-bottom:var(--xs);margin-bottom:var(--2xs);}
  .cat-head h2{font-family:var(--font-display);font-weight:600;font-size:clamp(20px,2.6vw,26px);margin:0;}
  .cat-full{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);}
  .cat-count{margin-left:auto;font-family:var(--font-mono);font-size:13px;color:var(--accent-deep);font-variant-numeric:tabular-nums;}

  .entry{
    display:grid;grid-template-columns:52px 1fr auto;column-gap:var(--md);align-items:baseline;
    padding:var(--md) var(--sm) var(--md) 0;border-bottom:1px solid var(--rule);transition:background .16s;
  }
  .entry:hover{background:var(--paper-inset);}
  .entry:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .entry-num{font-family:var(--font-mono);font-size:13px;color:var(--ink-faint);font-variant-numeric:tabular-nums;padding-left:var(--sm);transition:color .16s;}
  .entry:hover .entry-num{color:var(--accent);}
  .entry-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;}
  .entry-title{font-family:var(--font-display);font-weight:600;font-size:18px;line-height:1.3;margin:0;transition:color .16s;}
  .entry:hover .entry-title{color:var(--accent-deep);}
  .entry-en{font-family:var(--font-mono);font-size:12px;color:var(--ink-faint);}
  .badge{font-family:var(--font-mono);font-size:10.5px;border-radius:2px;padding:2px 7px;letter-spacing:.02em;}
  .badge.official{color:var(--accent-deep);background:var(--accent-wash);}
  .badge.community{color:var(--ext);background:var(--ext-wash);}
  .entry-desc{font-size:14px;color:var(--ink-soft);line-height:1.66;max-width:74ch;margin:6px 0 0;}
  .entry-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
  .entry-tags span{font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);border:1px solid var(--rule-strong);border-radius:2px;padding:2px 8px;}
  .entry-go{font-family:var(--font-mono);font-size:12px;color:var(--accent-deep);white-space:nowrap;transition:transform .16s ease-out,color .16s;}
  .entry:hover .entry-go{transform:translateX(3px);color:var(--accent);}

  .empty{padding:var(--2xl) 0;text-align:center;}
  .empty h3{font-family:var(--font-display);font-size:20px;color:var(--ink-soft);margin:0 0 8px;font-weight:600;}
  .empty p{font-size:14px;color:var(--ink-faint);margin:0;}


  .fade-in{animation:fade .32s ease-out;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}

  @media (max-width:860px){
    .shell{grid-template-columns:1fr;}
    .rail{position:sticky;top:0;z-index:5;border-right:none;border-bottom:1px solid var(--rule);max-height:none;background:var(--paper);
      display:flex;gap:8px;overflow-x:auto;padding:var(--sm) var(--md);white-space:nowrap;}
    .rail-title{display:none;}
    .rail ul{display:flex;gap:8px;}
    .rail li{border:1px solid var(--rule-strong);border-radius:999px;padding:6px 14px;flex:0 0 auto;}
    .rail li::before{display:none;}
    .catalogue{padding:var(--md);}
  }
  @media (max-width:560px){
    .entry{grid-template-columns:1fr;row-gap:4px;}
    .entry-num{padding-left:0;}
    .entry-go{margin-top:6px;}
    .masthead-in{padding:var(--md) var(--md) var(--md);}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.12s!important;}
    .fade-in{animation:none;}
    .entry:hover .entry-go{transform:none;}
  }

  .badge.new{color:var(--accent-deep);background:var(--accent-wash);}
  .badge.archived,.badge.stale{color:var(--ink-soft);background:var(--paper-raised);}
  .badge.unverified{color:var(--ext);background:var(--ext-wash);}
  .badge.cn{color:oklch(45% 0.13 20);background:oklch(93% 0.05 25);}
  .entry-sub{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);border:1px solid var(--rule-strong);border-radius:2px;padding:2px 8px;}
  .statusbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:var(--sm);}
  .statusbar .sf-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);}
  .sf{font-family:var(--font-body);font-size:12.5px;border:1px solid var(--rule-strong);background:transparent;color:var(--ink-soft);border-radius:999px;padding:4px 13px;cursor:pointer;transition:all .16s;}
  .sf:hover{background:var(--paper-inset);}
  .sf.on{background:var(--accent-wash);color:var(--accent-deep);border-color:var(--accent);font-weight:600;}
  .sf:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .entry-desc{max-width:82ch;}
</style>
</head>

const STLABEL={new:"新",unverified:"未验证",stale:"停更",archived:"已归档",cn:"中国生态"};
const STORDER=["new","unverified","stale","archived","cn"];
let activeCat="all", activeStatus="all";
const railList=document.getElementById("rail-list"),catalogue=document.getElementById("catalogue"),
      readout=document.getElementById("readout"),searchEl=document.getElementById("search"),statusbar=document.getElementById("statusbar");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function catCount(id){return ROWS.filter(d=>d.cat===id).length;}

function buildRail(){
  let html=`<li data-cat="all" class="${activeCat==="all"?"active":""}" tabindex="0"><span class="cname">全部</span><span class="ccount">${ROWS.length}</span></li>`;
  CATS.forEach(c=>{const n=catCount(c.id);if(!n)return;
    html+=`<li data-cat="${c.id}" class="${activeCat===c.id?"active":""}" tabindex="0"><span class="cname">${esc(c.cn)}</span><span class="ccount">${n}</span></li>`;});
  railList.innerHTML=html;
  railList.querySelectorAll("li").forEach(li=>{
    const set=()=>{activeCat=li.dataset.cat;buildRail();render();catalogue.scrollIntoView({behavior:"smooth",block:"start"});};
    li.addEventListener("click",set);
    li.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();set();}});
  });
}
function buildStatus(){
  let html=`<span class="sf-label">状态</span><button class="sf ${activeStatus==="all"?"on":""}" data-st="all" type="button">全部</button>`;
  STORDER.forEach(k=>{const n=ROWS.filter(d=>d.st.includes(k)).length;if(!n)return;
    html+=`<button class="sf ${activeStatus===k?"on":""}" data-st="${k}" type="button">${STLABEL[k]} · ${n}</button>`;});
  statusbar.innerHTML=html;
  statusbar.querySelectorAll(".sf").forEach(b=>b.addEventListener("click",()=>{activeStatus=b.dataset.st;buildStatus();render();}));
}
function matches(d,q){
  if(activeStatus!=="all" && !d.st.includes(activeStatus)) return false;
  if(!q) return true;
  const c=CATS.find(x=>x.id===d.cat);
  const hay=(d.name+" "+d.cn+" "+d.sub+" "+d.desc+" "+(c?c.cn+" "+c.en:"")).toLowerCase();
  return q.split(/\s+/).every(t=>hay.includes(t));
}
function render(){
  const q=searchEl.value.trim().toLowerCase();
  const cats=activeCat==="all"?CATS.map(c=>c.id):[activeCat];
  let num=0,shown=0,html="";
  cats.forEach(cid=>{
    const c=CATS.find(x=>x.id===cid);
    const items=ROWS.filter(d=>d.cat===cid && matches(d,q));
    if(!items.length)return;
    html+=`<section class="cat-block"><header class="cat-head"><h2>${esc(c.cn)}</h2><span class="cat-full">${esc(c.en)}</span><span class="cat-count">${items.length}</span></header>`;
    items.forEach(d=>{
      num++;shown++;
      const badges=d.st.map(k=>`<span class="badge ${k}">${STLABEL[k]}</span>`).join("");
      const sub=d.sub?`<span class="entry-sub">${esc(d.sub)}</span>`:"";
      const title=d.cn?esc(d.cn):esc(d.name);
      const en=d.cn?`<span class="entry-en">${esc(d.name)}</span>`:"";
      html+=`<a class="entry" href="${esc(d.url)}" target="_blank" rel="noopener" title="${esc(d.name)}">
        <span class="entry-num">${String(num).padStart(3,"0")}</span>
        <span class="entry-main">
          <span class="entry-head"><h3 class="entry-title">${title}</h3>${en}${sub}${badges}</span>
          <p class="entry-desc">${esc(d.desc)}</p>
        </span>
        <span class="entry-go">访问 ↗</span>
      </a>`;
    });
    html+=`</section>`;
  });
  if(!shown) html=`<div class="empty"><h3>没有匹配的条目</h3><p>换个关键词、分类或状态试试</p></div>`;
  catalogue.innerHTML=html;
  catalogue.classList.remove("fade-in");void catalogue.offsetWidth;catalogue.classList.add("fade-in");
  readout.innerHTML=`共 <b>${shown}</b> / 全部 ${ROWS.length} 个条目`;
}
searchEl.addEventListener("input",render);
buildRail();buildStatus();render();
</script>
</body>
</html>
